[pytest]
# 测试只跑 tests/，不要让它去摸 data/ 或 vendor/
testpaths = tests
# 中文测试名和输出都必须走 UTF-8，否则 Windows 控制台会乱码
addopts = -q --strict-markers
filterwarnings =
    error::DeprecationWarning
    # 第三方库的弃用警告不归我们管
    default::DeprecationWarning:starlette.*
    default::DeprecationWarning:fastapi.*
    default::DeprecationWarning:pydantic.*
